title: Signage-Bildschirm
icon: display
num: default
status:
  draft:
    label: Entwurf
    text: Bildschirm ist nicht aktiv
  listed:
    label: Aktiv
    text: Bildschirm ist aktiv und für den Zugriff freigegeben

columns:
  - width: 2/3
    sections:
      settings:
        type: fields
        fields:
          title:
            label: Bildschirmname
            type: text
            required: true
            placeholder: z.B. Lobby-Display
            help: Interner Name für diesen Bildschirm
            width: 2/3

          screen_id:
            label: Bildschirm-ID
            type: text
            required: true
            help: Wird in URL verwendet (z.B. /signage/lobby-screen)
            width: 1/3
            icon: url

          orientation:
            label: Bildschirmausrichtung
            type: select
            options:
              horizontal: Horizontal (Querformat)
              vertical: Vertikal (Hochformat)
            default: horizontal
            width: 1/2
            help: Beeinflusst Inhaltslayout und Übergänge

      schedule:
        type: fields
        fields:
          info_schedule:
            type: info
            label: Programm
            theme: positive
            text: Welcher Kanal läuft. Der Primärkanal läuft immer, außer ein Eintrag im Programm ersetzt oder ergänzt ihn. Wann der Bildschirm überhaupt an ist, regeln die Betriebszeiten weiter unten.

          assigned_channel:
            label: Primärer Kanal
            type: select
            options: query
            query: site.find('signage/channels').children.listed.add(site.find('signage/channels').drafts)
            text: "{{ page.title }}"
            help: Standardkanal, wenn kein Zeitplan aktiv ist
            required: true
            empty: Keine Kanäle vorhanden - erstellen Sie zuerst einen

          channel_schedule:
            label: Programm (Kanal nach Tag und Uhrzeit)
            type: structure
            columns:
              channel: true
              mode: true
              days: true
              date_start: true
              date_end: true
              time_start: true
              time_end: true
            fields:
              channel:
                label: Kanal
                type: select
                options: query
                query: site.find('signage/channels').children.listed.add(site.find('signage/channels').drafts)
                text: "{{ page.title }}"
                width: 1/2
                required: true
              mode:
                label: Modus
                type: select
                options:
                  replace: Ersetzt Primärkanal
                  add: Ergänzt (Folien anhängen)
                default: replace
                required: true
                width: 1/2
              days:
                label: Wochentage
                type: checkboxes
                columns: 7
                options:
                  mon: Mo
                  tue: Di
                  wed: Mi
                  thu: Do
                  fri: Fr
                  sat: Sa
                  sun: So
                help: Leer = jeden Tag
              date_start:
                label: Ab Datum
                type: date
                display: DD.MM.YYYY
                width: 1/4
              date_end:
                label: Bis Datum
                type: date
                display: DD.MM.YYYY
                width: 1/4
              time_start:
                label: Von
                type: time
                width: 1/4
                step: 15
              time_end:
                label: Bis
                type: time
                width: 1/4
                step: 15
            help: |
              Leere Felder schränken nicht ein: ohne Wochentage = jeden Tag, ohne Datum = immer, ohne Uhrzeit = ganztägig. Für einen einzelnen Tag beide Datumsfelder gleich setzen.
              Die Reihenfolge ist die Priorität: Der erste passende „Ersetzt“-Eintrag ersetzt den Primärkanal, alle passenden „Ergänzt“-Einträge hängen ihre Folien hinten an.
            max: 20

      standby:
        type: fields
        fields:
          info_standby:
            type: info
            label: Betriebszeiten & Standby
            theme: info
            text: Wann der Bildschirm Inhalte zeigt und was er außerhalb dieser Zeiten anzeigt

          active_times:
            label: Betriebszeiten (Bildschirm an)
            type: structure
            fields:
              start:
                label: Startzeit
                type: time
                width: 1/3
                required: true
                step: 15
                default: "08:00"
              end:
                label: Endzeit
                type: time
                width: 1/3
                required: true
                step: 15
                default: "18:00"
              days:
                label: Tage
                type: checkboxes
                width: 1/3
                columns: 2
                options:
                  mon: Mo
                  tue: Di
                  wed: Mi
                  thu: Do
                  fri: Fr
                  sat: Sa
                  sun: So
                default:
                  - mon
                  - tue
                  - wed
                  - thu
                  - fri
            help: Nur in diesen Zeiten zeigt der Bildschirm das Programm. Außerhalb läuft die Standby-Anzeige. Ohne Eintrag bleibt der Bildschirm im Standby.
            max: 5

          standby_mode:
            label: Standby-Anzeige
            type: select
            options:
              blank: Schwarzer Bildschirm
              logo: Nur Logo anzeigen
              custom: Eigene Nachricht + Bild
            default: custom
            width: 1/2

          standby_transition:
            label: Übergangsdauer
            type: number
            default: 5
            min: 0
            max: 60
            step: 5
            after: Sekunden
            width: 1/2
            help: Einblendzeit beim Wechsel in Standby

          standby_image:
            label: Standby-Bild
            type: files
            max: 1
            layout: cards
            size: medium
            accepts:
              - image/jpeg
              - image/png
              - image/webp
              - image/svg+xml
            when:
              standby_mode: custom
            help: Hintergrundbild für Standby-Bildschirm

          standby_message:
            label: Standby-Nachricht
            type: textarea
            maxlength: 500
            buttons: false
            when:
              standby_mode: custom
            placeholder: z.B. "Anzeige wird um 8:00 Uhr fortgesetzt"
            help: Optionale Nachricht während Standby

  - width: 1/3
    sections:
      preview:
        type: fields
        fields:
          info_preview:
            type: info
            label: Bildschirmzugriff
            theme: notice
            text: |
              **Bildschirm-URL:**
              /signage/{{ page.slug }}

              **Status:** {{ page.statusLabel }}
              **Ausrichtung:** {{ page.optionLabel('orientation') }}

          preview_button:
            type: info
            text: |
              <a href="/signage/{{ page.slug }}" target="_blank" class="k-button">
                <span class="k-button-text">Bildschirm öffnen</span>
              </a>

          screen_preview:
            label: Live-Vorschau
            type: signage_preview
            help: Zeigt den Bildschirm direkt im Panel – ohne Gerät einzuhängen und freizugeben.

      access_control:
        type: fields
        fields:
          info_access:
            type: info
            label: Zugriffskontrolle
            theme: positive
            text: Kontrollieren Sie, welche Geräte diesen Bildschirm anzeigen können

          whitelist_enabled:
            label: Zugriffsmodus
            type: toggle
            text:
              - Öffentlich (keine Einschränkung)
              - Nur Whitelist (Genehmigung erforderlich)
            default: true
            help: Bei Aktivierung müssen neue Geräte vor der Anzeige genehmigt werden

      pending_requests_display:
        type: fields
        fields:
          pending_requests:
            label: Genehmigte Geräte
            help: Übersicht der Geräte, die aktuell für diesen Bildschirm freigegeben sind
            type: pending_requests
            screen: "{{ page.slug }}"

      info:
        type: fields
        fields:
          info_help:
            type: info
            label: Hilfe
            theme: info
            text: |
              **Schnellstart:**
              1. Ausrichtung & Betriebszeiten festlegen
              2. Inhaltskanal zuweisen
              3. Zugriffskontrolle konfigurieren
              4. Bildschirm-URL öffnen

              **Problemlösung:**
              - Kein Inhalt? Prüfen Sie, ob der Kanal Folien hat
              - Zugriff verweigert? Whitelist-Einstellungen prüfen
              - Bildschirm bleibt im Standby? Betriebszeiten prüfen
