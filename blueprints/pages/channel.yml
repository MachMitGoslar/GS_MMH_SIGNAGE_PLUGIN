title: Inhaltskanal
icon: layers
status:
  draft:
    label: Entwurf
    text: Kanal ist nur im Panel sichtbar
  listed:
    label: Veröffentlicht
    text: Kanal ist aktiv und kann Bildschirmen zugewiesen werden

columns:
  - width: 2/3
    sections:
      info:
        type: fields
        fields:
          title:
            label: Kanalname
            type: text
            required: true
            placeholder: z.B. Haupt-Inhaltskanal
            width: 2/3

          channel_id:
            label: Kanal-ID
            type: text
            required: true
            width: 1/3

          description:
            label: Beschreibung
            type: textarea
            maxlength: 500
            buttons: false
            placeholder: Beschreiben Sie den Zweck dieses Kanals
            help: Nur zur internen Referenz

      default_background:
        type: fields
        fields:
          info_background:
            type: info
            label: Standard-Hintergrund
            theme: notice
            text: Dieser Hintergrund wird für Folien verwendet, die keine eigenen Hintergrundmedien haben.

          default_bg_image:
            label: Standard-Hintergrundbild
            type: files
            max: 1
            layout: cards
            width: 1/2
            uploads:
              template: blocks/image
            help: Fallback-Hintergrund für Folien ohne eigene Medien

          default_bg_video:
            label: Standard-Hintergrundvideo
            type: files
            max: 1
            layout: cards
            width: 1/2
            uploads:
              template: blocks/video
            accepts:
              - video/mp4
              - video/webm
            help: Optionales Endlosvideo-Hintergrund (überschreibt Bild)

          default_overlay_color:
            label: Standard-Overlay-Farbe
            type: color
            width: 1/2
            default: "#000000"
            help: Farbüberlagerung auf Hintergrundmedien

          default_overlay_opacity:
            label: Standard-Overlay-Deckkraft
            type: range
            width: 1/2
            min: 0
            max: 100
            step: 5
            default: 40
            after: "%"
            help: 0% = kein Overlay, 100% = Volltonfarbe

      slides:
        type: fields
        fields:
          slides:
            label: Inhaltsfolien
            type: pages
            multiple: true
            sortable: true
            query: site.find('signage/slides').childrenAndDrafts
            image:
              icon: image
            info: "{{ page.slide_type.or('blocks') }} — {{ page.calculatedDuration }} Sek. — {{ page.status }}"
            empty: Noch keine Folien zugeordnet. Wählen Sie Folien aus der Bibliothek aus.
            help: |
              Folien stammen aus der gemeinsamen Folien-Bibliothek und können in mehreren Kanälen verwendet werden.
              Ziehen zum Neuanordnen. Neue Folien legen Sie unter Signage → Folien an.

  - width: 1/3
    sections:
      stats:
        type: fields
        fields:
          info_stats:
            type: info
            label: Kanalstatistiken
            theme: info
            text: |
              **Anzahl Folien:** {{ page.slideCount }}
              **Gesamtdauer:** {{ page.slidesTotalDuration }} Sekunden

      preview:
        type: fields
        fields:
          channel_preview:
            label: Vorschau
            type: signage_preview
            help: Zeigt den Kanal so, wie er auf einem Bildschirm läuft – ohne Gerätefreigabe.
