title: Inhaltskanal
icon: layers
status:
  draft:
    label: Entwurf
    text: Kanal ist nur im Panel sichtbar
  listed:
    label: Veröffentlicht
    text: Kanal ist aktiv und kann Bildschirmen zugewiesen werden

columns:
  - width: 2/3
    sections:
      info:
        type: fields
        fields:
          title:
            label: Kanalname
            type: text
            required: true
            placeholder: z.B. Haupt-Inhaltskanal
            width: 2/3

          channel_id:
            label: Kanal-ID
            type: text
            required: true
            width: 1/3

          description:
            label: Beschreibung
            type: textarea
            maxlength: 500
            buttons: false
            placeholder: Beschreiben Sie den Zweck dieses Kanals
            help: Nur zur internen Referenz

      default_background:
        type: fields
        fields:
          info_background:
            type: info
            label: Standard-Look
            theme: notice
            text: Gilt für alle Folien dieses Kanals, deren Hintergrund bzw. Farbschema auf „Wie im Kanal“ steht.

          default_bg_image:
            extends: fields/mediathek-image
            label: Hintergrundbild
            width: 1/2

          default_bg_focus:
            label: Bildausschnitt
            type: image-focus
            image: default_bg_image
            width: 1/2
            help: Leer = Fokuspunkt aus der Mediathek.

          default_bg_video:
            label: Hintergrundvideo
            type: files
            max: 1
            layout: cards
            width: 1/2
            uploads:
              template: blocks/video
            accepts:
              - video/mp4
              - video/webm
            help: Endlosvideo, stumm. Geht vor dem Bild.

          default_bg_color:
            label: Vollton
            type: color
            width: 1/2
            default: "#000000"
            help: Ohne Bild und Video.

          default_color_scheme:
            label: Farbschema
            type: select
            options:
              light: Hell – dunkle Schrift
              dark: Dunkel – helle Schrift
            default: dark
            required: true
            width: 1/2

          default_overlay_preset:
            label: Lesbarkeit (Overlay)
            type: select
            options:
              none: Kein Overlay
              soft: Leicht abtönen
              strong: Kräftig abtönen
              fade_bottom: Verlauf von unten
              fade_left: Verlauf von links
              custom: Benutzerdefiniert
            default: soft
            width: 1/2
            help: Über Bild oder Video, Farbe aus dem Farbschema.

          default_overlay_color:
            label: Overlay-Farbe
            type: color
            width: 1/2
            default: "#000000"
            when:
              default_overlay_preset: custom

          default_overlay_opacity:
            label: Deckkraft
            type: range
            width: 1/2
            min: 0
            max: 100
            step: 5
            default: 40
            after: "%"
            when:
              default_overlay_preset: custom

          default_overlay_gradient:
            label: Verlaufsrichtung
            type: select
            width: 1/2
            options:
              none: Kein Verlauf (gleichmäßig)
              to-top: Farbe unten, nach oben auslaufend
              to-bottom: Farbe oben, nach unten auslaufend
              to-left: Farbe rechts, nach links auslaufend
              to-right: Farbe links, nach rechts auslaufend
              radial: Farbe am Rand, Mitte frei
            default: none
            when:
              default_overlay_preset: custom

          default_overlay_strength:
            label: Verlaufsstärke
            type: range
            width: 1/2
            min: 10
            max: 100
            step: 5
            default: 60
            after: "%"
            help: Wie weit die Farbe ins Bild reicht
            when:
              default_overlay_preset: custom

      slides:
        type: fields
        fields:
          slides:
            label: Inhaltsfolien
            type: signage_slides
            sortable: true
            empty: Noch keine Folien zugeordnet. Wählen Sie Folien aus der Bibliothek aus.
            help: |
              Folien stammen aus der gemeinsamen Folien-Bibliothek und können in mehreren Kanälen verwendet werden.
              Die Anzeigedauer gilt nur in diesem Kanal; leer = automatisch aus dem Inhalt berechnet.
              Ziehen zum Neuanordnen. Neue Folien legen Sie unter Signage → Folien an.
            columns:
              slide:
                width: 3/4
                mobile: true
              duration:
                width: 1/4
                after: Sek.
                # narrow tables only show "mobile" columns
                mobile: true
            fields:
              slide:
                label: Folie
                type: pages
                multiple: false
                required: true
                query: site.find('signage/slides').childrenAndDrafts
                image:
                  icon: image
                info: "{{ page.optionLabel('slide_type') }} — automatisch {{ page.calculatedDuration }} Sek. — {{ page.statusLabel }}"
                width: 3/4
              duration:
                label: Anzeigedauer
                type: number
                min: 3
                max: 300
                after: Sek.
                placeholder: automatisch
                help: Leer = automatisch berechnet
                width: 1/4

  - width: 1/3
    sections:
      stats:
        type: fields
        fields:
          info_stats:
            type: info
            label: Kanalstatistiken
            theme: info
            text: |
              **Anzahl Folien:** {{ page.slideCount }}
              **Gesamtdauer (aktive Folien):** {{ page.slidesTotalDuration }} Sekunden

              {{ page.slidesDurationSummary }}

      preview:
        type: fields
        fields:
          channel_preview:
            label: Vorschau
            type: signage_preview
            help: Zeigt den Kanal so, wie er auf einem Bildschirm läuft – ohne Gerätefreigabe.
